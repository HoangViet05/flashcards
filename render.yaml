services:
  - type: web
    name: flashcards-api
    runtime: python
    plan: starter
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: flashcards-db
          property: connectionString
      - key: APP_DATA_DIR
        value: /var/data
      - key: CORS_ORIGINS
        value: http://localhost:5173,http://127.0.0.1:5173
      - key: CORS_ORIGIN_REGEX
        value: '^https://.*\.vercel\.app$'
    disk:
      name: app-data
      mountPath: /var/data
      sizeGB: 1

databases:
  - name: flashcards-db
    plan: basic-256mb
    region: singapore
    databaseName: flashcards
    user: flashcards
